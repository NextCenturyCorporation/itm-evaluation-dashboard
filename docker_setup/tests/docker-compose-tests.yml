services:
  mongo:
    image: mongo:4.0
    command: ["mongod", "--bind_ip_all", "--quiet"]
    expose:
      - "27017"
    healthcheck:
      # Use a TCP probe instead of launching the Mongo shell every 5 seconds.
      # This avoids MongoDB 4.0 logging a client-metadata line for every healthcheck.
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/27017'"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    image: dashboard-tests:local
    user: "node"
    working_dir: /workspace
    environment:
      HOME: /home/node
      NODE_ENV: test
      REACT_APP_TESTING: "true"
      TEST_MONGO_URL: mongodb://mongo:27017
      NODE_OPTIONS: --max-old-space-size=8192
      JEST_TEST_TIMEOUT: "30000"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROME_BIN: /usr/bin/chromium
    volumes:
      - ../..:/workspace
    shm_size: "2gb"
    depends_on:
      mongo:
        condition: service_healthy
    command: ["bash", "-lc", "npm run setup-tests && npm run test"]